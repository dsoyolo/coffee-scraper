[project]
name = "coffee-scraper-backend"
version = "1.0.0"
description = "Coffee price aggregator — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "mangum==0.19.0",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.3",
    "lxml==5.3.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.0",
    "boto3==1.37.14",
    "pyyaml==6.0.2",
    "python-dateutil==2.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-mock==3.14.0",
    "moto[dynamodb]==5.0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: live HTTP tests — run with pytest -m network (skipped by default)",
]

[tool.uv]
package = false
